<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station spatiale GTR</title>
<meta name="description" content="Station spatiale 3D en orbite : les bots de Guy au travail dans leurs modules, en attente ou en pause dans la cupole.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%238b7bff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
</script>
</head>
<body>
<div class="app">
  <main class="vue">
    <div id="scene" aria-label="Scène 3D de la station. Touchez un astronaute pour voir sa fiche."></div>
    <header class="entete">
      <div class="titre"><span class="logo" aria-hidden="true"></span><h1>Station spatiale GTR</h1><span id="badge-mode" class="badge">En direct</span></div>
      <ul class="compteurs" aria-live="polite">
        <li><span class="pt occupe"></span><b id="c-occupe">0</b> au travail</li>
        <li><span class="pt attend"></span><b id="c-attend">0</b> attend Guy</li>
        <li><span class="pt libre"></span><b id="c-libre">0</b> libres</li>
        <li><span class="pt bureau"></span><b id="c-bureaux">0</b> modules calmes</li>
      </ul>
    </header>
    <div class="commandes">
      <ul class="legende" aria-label="Légende des états">
        <li><span class="pt occupe"></span>Au travail</li>
        <li><span class="pt attend"></span>Attend Guy</li>
        <li><span class="pt libre"></span>Libre</li>
      </ul>
      <div class="vues" role="group" aria-label="Vue d'orbite">
        <button data-vue="ensemble" aria-pressed="true">◎ Ensemble</button>
        <button data-vue="jour" aria-pressed="false">☀ Côté jour</button>
        <button data-vue="nuit" aria-pressed="false">☾ Côté nuit</button>
        <button data-vue="cupole" aria-pressed="false">◍ Cupole</button>
      </div>
      <button id="btn-sim" class="sim" type="button" aria-pressed="false"><span class="ico" aria-hidden="true"></span><span class="lib">Simulation</span></button>
    </div>
    <aside id="fiche" class="fiche" hidden role="dialog" aria-labelledby="fiche-nom">
      <button id="fiche-fermer" class="fermer" aria-label="Fermer la fiche">×</button>
      <h2 id="fiche-nom"></h2>
      <p id="fiche-equipe" class="doux"></p>
      <p><span id="fiche-etat" class="etat"></span></p>
      <p id="fiche-tache"></p>
    </aside>
    <p id="erreur" class="erreur" hidden></p>
  </main>
  <section class="panneau">
    <details id="d-equipe" open>
      <summary>Équipage <span id="nb-bots" class="doux"></span></summary>
      <ul id="liste-equipe" class="liste"></ul>
    </details>
    <details id="d-activite" open>
      <summary>Activité <span id="maj" class="doux"></span></summary>
      <ul id="liste-activite" class="activite"></ul>
    </details>
  </section>
  <footer class="pied">
    <p>© GTR Technologies Inc. · Tous droits réservés.</p>
    <p>Site réalisé par la GTR-Teams</p>
  </footer>
</div>
<script type="module">
// Choix du rendu : 3D si WebGL répond, sinon vue 2D (SVG) avec les mêmes données
const q = new URLSearchParams(location.search);
let ok = false;
if (!q.has('sans3d')) {
  try { const c = document.createElement('canvas'); const gl = c.getContext('webgl2') || c.getContext('webgl'); ok = !!gl; gl && gl.getExtension('WEBGL_lose_context')?.loseContext(); } catch { ok = false; }
}
const secours = () => import('./secours2d.js');
if (ok) import('./app.js').catch((e) => { console.info('3D indisponible, vue 2D :', e && e.message); secours(); });
else secours();
</script>
</body>
</html>
